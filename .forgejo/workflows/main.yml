name: release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: any
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GoReleaser
        uses: https://github.com/goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITEA_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
